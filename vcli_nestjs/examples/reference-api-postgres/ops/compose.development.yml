name: reference-api-postgres-development
services:
  postgres:
    profiles: [postgres]
    image: postgres:16.16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
    environment:
      POSTGRES_USER: reference
      POSTGRES_DB: reference
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports: [127.0.0.1:55432:5432]
    volumes: [postgres-data:/var/lib/postgresql/data]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U reference -d reference']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  centrifugo:
    profiles: [centrifugo]
    image: centrifugo/centrifugo:v6.10.3
    command: [centrifugo, -c, /etc/centrifugo/config.json]
    extra_hosts: [host.docker.internal:host-gateway]
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3101}
      CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS: ${CENTRIFUGO_CALLBACK_HEADERS:-}
      CENTRIFUGO_CLIENT_PROXY_REFRESH_HTTP_STATIC_HEADERS: ${CENTRIFUGO_CALLBACK_HEADERS:-}
    ports: [127.0.0.1:58000:8000, 127.0.0.1:59000:9000]
    volumes: [./centrifugo/config.json:/etc/centrifugo/config.json:ro]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
  vector:
    profiles: [diagnostics]
    image: timberio/vector:0.62.0-debian
    command: [--config, /etc/vector/vector.yaml]
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ./diagnostics/vector.yaml:/etc/vector/vector.yaml:ro
      - ../var/evidence:/evidence:ro
      - vector-checkpoints:/var/lib/vector
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: local
      options: { max-size: 5m, max-file: '2' }
    restart: unless-stopped
    # No Docker socket; only this app's already sanitized JSONL is collected.
volumes:
  postgres-data: {}
  vector-checkpoints: {}
