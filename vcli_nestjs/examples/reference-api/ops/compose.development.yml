name: reference-api-development
services:
  mongodb:
    profiles: [mongodb]
    image: mongo:8.0.38@sha256:9b73c38e39783bd21335f603a9f08be60fe385f5c28933ea32bb4a9fa1fd6d23
    command:
      [mongod, --replSet, rs0, --bind_ip_all, --wiredTigerCacheSizeGB, '0.25']
    ports: [127.0.0.1:57017:27017]
    volumes: [mongodb-data:/data/db]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test:
        [
          CMD,
          mongosh,
          --quiet,
          --eval,
          'quit(db.adminCommand({ping:1}).ok ? 0 : 1)',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  centrifugo:
    profiles: [centrifugo]
    image: centrifugo/centrifugo:v6.10.3
    command: [centrifugo, -c, /etc/centrifugo/config.json]
    extra_hosts: [host.docker.internal:host-gateway]
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3100}
      CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS: ${CENTRIFUGO_CALLBACK_HEADERS:-}
      CENTRIFUGO_CLIENT_PROXY_REFRESH_HTTP_STATIC_HEADERS: ${CENTRIFUGO_CALLBACK_HEADERS:-}
    ports: [127.0.0.1:58000:8000, 127.0.0.1:59000:9000]
    volumes: [./centrifugo/config.json:/etc/centrifugo/config.json:ro]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
  vector:
    profiles: [diagnostics]
    image: timberio/vector:0.62.0-debian
    command: [--config, /etc/vector/vector.yaml]
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ./diagnostics/vector.yaml:/etc/vector/vector.yaml:ro
      - ../var/evidence:/evidence:ro
      - vector-checkpoints:/var/lib/vector
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: local
      options: { max-size: 5m, max-file: '2' }
    restart: unless-stopped
    # No Docker socket; only this app's already sanitized JSONL is collected.
volumes:
  mongodb-data: {}
  vector-checkpoints: {}
