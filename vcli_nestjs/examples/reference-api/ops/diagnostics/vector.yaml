data_dir: /var/lib/vector
api:
  enabled: false
sources:
  application:
    type: file
    include: [/evidence/events-*.jsonl]
    read_from: beginning
    max_line_bytes: 4096
    fingerprint:
      strategy: device_and_inode
transforms:
  sanitize:
    type: remap
    inputs: [application]
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: false
    source: |
      parsed = parse_json!(string!(.message))
      if parsed.version != 1 || parsed.project != "reference-api" || parsed.service != "reference-api" { abort }
      # Rebuild approved facts; never forward original message or source metadata.
      . = {}
      .version = 1
      .project = "reference-api"
      .service = "reference-api"
      .source = "application-jsonl"
      .parse_status = "normalized"
      .timestamp = string!(parsed.timestamp)
      if !match(.timestamp, r'^\d{4}-\d{2}-\d{2}T[0-9:.]+Z$') { abort }
      _parsedTimestamp = parse_timestamp!(.timestamp, format: "%+")
      .environment = string!(parsed.environment)
      if !includes(["development", "test", "production"], .environment) { abort }
      .severity = string!(parsed.severity)
      if !includes(["debug", "info", "warn", "error"], .severity) { abort }
      .event = string!(parsed.event)
      if !includes(["application.starting", "application.started", "application.stopping", "application.stopped", "application.start-failed", "application.shutdown-failed", "application.start-cleanup-failed", "framework.log", "http.completed", "http.failed", "realtime.admitted", "realtime.denied", "realtime.dropped", "operation.completed", "operation.failed"], .event) { abort }
      if exists(parsed.requestId) {
        value = string!(parsed.requestId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .requestId = value
      }
      if exists(parsed.operationId) {
        value = string!(parsed.operationId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .operationId = value
      }
      if exists(parsed.runId) {
        value = string!(parsed.runId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .runId = value
      }
      if exists(parsed.writerId) {
        value = string!(parsed.writerId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .writerId = value
      }
      if exists(parsed.errorCode) {
        value = string!(parsed.errorCode)
        if !includes(["UNAUTHENTICATED", "AUTHORITY_UNAVAILABLE", "REALTIME_LIMIT", "INVALID_REQUEST", "INTERNAL_ERROR", "NOT_FOUND", "DEPENDENCY_UNAVAILABLE", "DIAGNOSTICS_UNAVAILABLE", "INVALID_REALTIME_TICKET", "NOTE_NOT_FOUND", "PAYLOAD_TOO_LARGE", "REQUEST_ABORTED", "STARTUP_FAILED", "SHUTDOWN_FAILED", "INVALID_CONFIG", "DATABASE_UNAVAILABLE", "DATABASE_URL_REQUIRED", "ENV_FILE_UNAVAILABLE", "UNSAFE_ENV_FILE", "INVALID_CREDENTIALS", "RATE_LIMITED", "SESSION_REVOKED", "SESSION_NOT_FOUND", "RECENT_AUTH_REQUIRED", "EMAIL_VERIFICATION_REQUIRED", "RECORD_NOT_FOUND", "MEDIA_NOT_FOUND", "MEDIA_CONFLICT", "STORAGE_UNAVAILABLE", "FIREBASE_UNAVAILABLE", "FIREBASE_USER_DISABLED", "FIREBASE_TOKEN_REVOKED"], value) { abort }
        .errorCode = value
      }
      if exists(parsed.route) {
        value = string!(parsed.route)
        if !includes(["/", "/reference", "/reference/config", "/notes", "/notes/:id", "/health/live", "/health/ready", "/accounts/me", "/sessions", "/sessions/revoke", "/identity/firebase/bootstrap", "/identity/local/register", "/identity/local/login", "/identity/local/refresh", "/identity/local/password/change", "/identity/local/verification/request", "/identity/local/verification/confirm", "/identity/local/reset/request", "/identity/local/reset/confirm", "/media", "/media/uploads", "/media/uploads/:id/content", "/media/uploads/:id/finalize", "/media/:id/content", "/media/:id", "/media/cleanup", "/push/destinations", "/push/destinations/:id", "/push/self", "/realtime/profile", "/realtime/tickets", "/realtime/centrifugo-grants", "/realtime/centrifugo/connect", "/realtime/centrifugo/refresh"], value) { abort }
        .route = value
      }
      if exists(parsed.method) {
        value = string!(parsed.method)
        if !includes(["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "CONNECT", "TRACE"], value) { abort }
        .method = value
      }
      if exists(parsed.count) {
        value = int!(parsed.count)
        if value < 0 || value > 1000000 { abort }
        .count = value
      }
      if exists(parsed.statusCode) {
        value = int!(parsed.statusCode)
        if value < 100 || value > 599 { abort }
        .statusCode = value
      }
      if exists(parsed.sequence) {
        value = int!(parsed.sequence)
        if value < 1 || value > 9007199254740991 { abort }
        .sequence = value
      }
      if exists(parsed.durationMs) {
        value = to_float!(parsed.durationMs)
        if !is_integer(parsed.durationMs) && !is_float(parsed.durationMs) { abort }
        if value < 0.0 || value > 86400000.0 { abort }
        .durationMs = value
      }
      # No free text, URL, headers, cookies, payloads or raw environments survive.
sinks:
  live:
    type: socket
    inputs: [sanitize]
    mode: tcp
    address: host.docker.internal:58233
    encoding: { codec: json }
    framing: { method: newline_delimited }
    buffer: { type: memory, max_events: 128, when_full: drop_newest }
    acknowledgements: { enabled: false }
tests:
  - name: approved facts survive while private sentinel fields are removed
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","requestId":"12345678-1234-4123-8123-123456789abc","operationId":"22345678-1234-4123-8123-123456789abc","runId":"32345678-1234-4123-8123-123456789abc","writerId":"42345678-1234-4123-8123-123456789abc","sequence":17,"count":2,"durationMs":12.5,"method":"POST","statusCode":201,"route":"/notes","headers":{"authorization":"private-sentinel-cookie-token-signed-url"},"message":"private-sentinel-cookie-token-signed-url","error":{"stack":"private-sentinel-cookie-token-signed-url"},"url":"https://private.invalid/?sig=private-sentinel-cookie-token-signed-url"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.route, "/notes")
              assert_eq!(.method, "POST")
              assert_eq!(.statusCode, 201)
              assert_eq!(.durationMs, 12.5)
              assert_eq!(.count, 2)
              assert_eq!(.sequence, 17)
              assert_eq!(.writerId, "42345678-1234-4123-8123-123456789abc")
              assert_eq!(.requestId, "12345678-1234-4123-8123-123456789abc")
              assert_eq!(.operationId, "22345678-1234-4123-8123-123456789abc")
              assert_eq!(.runId, "32345678-1234-4123-8123-123456789abc")
              assert!(!exists(.message) && !exists(.headers) && !exists(.error) && !exists(.url))
              assert!(!contains(encode_json(.), "private-sentinel"))
  - name: malformed JSON is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{malformed'
  - name: unknown events are dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"private.arbitrary-event"}'
  - name: foreign project is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"other-project","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: foreign service is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"other-service","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: unsupported schema version is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":2,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: raw route URLs are dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","route":"/notes/secret-id?token=private-sentinel-cookie-token-signed-url"}'
  - name: out of bounds status is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","statusCode":999}'
  - name: out of bounds duration is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","durationMs":86400001}'
  - name: non-numeric duration is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","durationMs":"12.5"}'
  - name: invalid calendar timestamp is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-99-99T12:00:00Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: application.start-failed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"application.start-failed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "application.start-failed")'
  - name: application.stopped is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"application.stopped"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "application.stopped")'
  - name: framework.log is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"debug","event":"framework.log"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "framework.log")'
  - name: http.failed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.failed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "http.failed")'
  - name: operation.completed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"operation.completed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "operation.completed")'
  - name: operation.failed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"reference-api","service":"reference-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"operation.failed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "operation.failed")'
