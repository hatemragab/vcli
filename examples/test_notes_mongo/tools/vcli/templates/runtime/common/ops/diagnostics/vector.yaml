data_dir: /var/lib/vector
api:
  enabled: false
sources:
  application:
    type: file
    # Root removes unselected source globs; all inputs are sanitized application-owned retention.
    include:
      [
        /evidence/events-*.jsonl,
        /evidence/workers/events-*.jsonl,
        /evidence/database/events-*.jsonl,
        /evidence/infrastructure/events-*.jsonl,
        /evidence/tests/events-*.jsonl,
      ]
    read_from: beginning
    max_line_bytes: 4096
    fingerprint:
      strategy: device_and_inode
transforms:
  sanitize:
    type: remap
    inputs: [application]
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: false
    source: |
      parsed = parse_json!(string!(.message))
      if parsed.version != 1 || parsed.project != "generated-api" || parsed.service != "generated-api" { abort }
      selected_source = "application"
      if exists(parsed.source) { selected_source = string!(parsed.source) }
      if !includes(["application", "workers", "database", "infrastructure", "tests"], selected_source) { abort }
      if exists(.file) {
        evidence_path = string!(.file)
        expected_prefix = "/evidence/" + selected_source + "/events-"
        if selected_source == "application" { expected_prefix = "/evidence/events-" }
        if !starts_with(evidence_path, expected_prefix) { abort }
      }
      # Rebuild approved facts; never forward original message or source metadata.
      . = {}
      .version = 1
      .project = "generated-api"
      .service = "generated-api"
      .source = selected_source
      .parse_status = "normalized"
      .parseStatus = "validated"
      if exists(parsed.parseStatus) { .parseStatus = string!(parsed.parseStatus) }
      if !includes(["validated", "rejected"], .parseStatus) { abort }
      .timestamp = string!(parsed.timestamp)
      if !match(.timestamp, r'^\d{4}-\d{2}-\d{2}T[0-9:.]+Z$') { abort }
      _parsedTimestamp = parse_timestamp!(.timestamp, format: "%+")
      .environment = string!(parsed.environment)
      if !includes(["development", "test", "production"], .environment) { abort }
      .severity = string!(parsed.severity)
      if !includes(["debug", "info", "warn", "error"], .severity) { abort }
      .event = string!(parsed.event)
      if exists(parsed.job) && !starts_with(.event, "job.") { abort }
      if (exists(parsed.database) || exists(parsed.databaseOperation)) && !starts_with(.event, "database.") { abort }
      if exists(parsed.infrastructure) && .event != "infrastructure.sampled" { abort }
      if exists(parsed.testResult) && .event != "test.result" { abort }
      if !includes(["application.starting", "application.started", "application.stopping", "application.stopped", "application.start-failed", "application.shutdown-failed", "application.start-cleanup-failed", "framework.log", "http.completed", "http.failed", "realtime.admitted", "realtime.denied", "realtime.dropped", "operation.completed", "operation.failed", "job.started", "job.completed", "job.failed", "database.completed", "database.failed", "infrastructure.sampled", "test.result", "source.status"], .event) { abort }
      if starts_with(.event, "job.") {
        if selected_source != "workers" { abort }
        .job = string!(parsed.job)
        if !includes(["mail-dispatch", "identity-cleanup", "media-cleanup", "push-delivery", "maintenance", "diagnostic-check"], .job) { abort }
      } else if starts_with(.event, "database.") {
        if selected_source != "database" { abort }
        .database = string!(parsed.database)
        # Root narrows this allowlist to the selected native database literal.
        if !includes(["mongodb", "postgres"], .database) { abort }
        .databaseOperation = string!(parsed.databaseOperation)
        if !includes(["connect", "transaction", "read", "write", "schema", "close"], .databaseOperation) { abort }
      } else if .event == "infrastructure.sampled" {
        if selected_source != "infrastructure" || parsed.infrastructure.component != "node-process" { abort }
        rss = int!(parsed.infrastructure.rssBytes)
        heap = int!(parsed.infrastructure.heapUsedBytes)
        uptime = to_float!(parsed.infrastructure.uptimeSeconds)
        if !is_integer(parsed.infrastructure.uptimeSeconds) && !is_float(parsed.infrastructure.uptimeSeconds) { abort }
        if rss < 0 || rss > 1099511627776 || heap < 0 || heap > 1099511627776 || uptime < 0.0 || uptime > 315360000.0 { abort }
        .infrastructure = {"component": "node-process", "rssBytes": rss, "heapUsedBytes": heap, "uptimeSeconds": uptime}
      } else if .event == "test.result" {
        if selected_source != "tests" || !exists(parsed.runId) || !exists(parsed.operationId) { abort }
        outcome = string!(parsed.testResult.outcome)
        if !includes(["passed", "failed", "aborted"], outcome) { abort }
        logs_complete = bool!(parsed.testResult.logsComplete)
        cleanup_complete = bool!(parsed.testResult.cleanupComplete)
        assertions = array!(parsed.testResult.assertions)
        artifacts = array!(parsed.testResult.artifacts)
        if length(assertions) > 8 || length(artifacts) > 4 { abort }
        approved_assertions = []
        has_failed = false
        has_passed = false
        for_each(assertions) -> |_index, assertion| {
          check = string!(assertion.check)
          if !includes(["exit-code", "http-status", "persistence", "authorization", "redaction", "protocol", "invariant", "custom"], check) { abort }
          ordinal = int!(assertion.ordinal)
          if ordinal < 0 || ordinal > 10000 { abort }
          assertion_outcome = string!(assertion.outcome)
          if !includes(["passed", "failed", "skipped"], assertion_outcome) { abort }
          if assertion_outcome == "failed" { has_failed = true }
          if assertion_outcome == "passed" { has_passed = true }
          code = string!(assertion.code)
          if !includes(["MATCH", "MISMATCH", "ASSERTION_FAILED", "EXECUTION_ABORTED", "INVALID_REPORT", "NOT_OBSERVED"], code) { abort }
          approved_assertions = push(approved_assertions, {"check": check, "ordinal": ordinal, "outcome": assertion_outcome, "code": code})
        }
        approved_artifacts = []
        if (outcome == "passed" && (has_failed || !has_passed)) || (outcome == "failed" && !has_failed) { abort }
        for_each(artifacts) -> |_index, artifact| {
          kind = string!(artifact.kind)
          if !includes(["screenshot", "http-transcript", "assertion-report", "provider-receipt"], kind) { abort }
          bytes = int!(artifact.bytes)
          digest = string!(artifact.sha256)
          if bytes < 0 || bytes > 10485760 || !match(digest, r'^[a-f0-9]{64}$') { abort }
          approved_artifacts = push(approved_artifacts, {"kind": kind, "bytes": bytes, "sha256": digest})
        }
        .testResult = {"outcome": outcome, "logsComplete": logs_complete, "cleanupComplete": cleanup_complete, "assertions": approved_assertions, "artifacts": approved_artifacts}
        if exists(parsed.testResult.revision) {
          revision = string!(parsed.testResult.revision)
          if !match(revision, r'^(?:[a-f0-9]{40}|[a-f0-9]{64})$') { abort }
          .testResult.revision = revision
        }
        if exists(parsed.testResult.dirty) { .testResult.dirty = bool!(parsed.testResult.dirty) }
        if exists(parsed.testResult.capabilities) {
          capabilities = array!(parsed.testResult.capabilities)
          if length(capabilities) > 16 { abort }
          for_each(capabilities) -> |_index, capability| {
            if !includes(["foundation.nest", "database.mongodb", "database.postgres", "auth.local", "auth.firebase", "mail.capture", "mail.smtp", "storage.local", "storage.aws-s3", "storage.r2", "media.private", "push.fcm", "push.apns", "realtime.socket-io", "realtime.native-ws", "realtime.centrifugo", "diagnostics.local", "diagnostics.restricted-remote-read", "deployment.dokploy", "deployment.coolify", "deployment.caprover"], capability) { abort }
          }
          .testResult.capabilities = capabilities
        }
        approved_versions = {}
        if exists(parsed.testResult.versions) && !is_object(parsed.testResult.versions) { abort }
        if exists(parsed.testResult.versions.node) {
          version = string!(parsed.testResult.versions.node)
          if !match(version, r'^\d{1,3}\.\d{1,3}\.\d{1,3}$') { abort }
          approved_versions.node = version
        }
        if exists(parsed.testResult.versions.database) {
          version = string!(parsed.testResult.versions.database)
          if !match(version, r'^\d{1,3}\.\d{1,3}\.\d{1,3}$') { abort }
          approved_versions.database = version
        }
        if exists(parsed.testResult.versions.vector) {
          version = string!(parsed.testResult.versions.vector)
          if !match(version, r'^\d{1,3}\.\d{1,3}\.\d{1,3}$') { abort }
          approved_versions.vector = version
        }
        if exists(parsed.testResult.versions.logdy) {
          version = string!(parsed.testResult.versions.logdy)
          if !match(version, r'^\d{1,3}\.\d{1,3}\.\d{1,3}$') { abort }
          approved_versions.logdy = version
        }
        if exists(parsed.testResult.versions) { .testResult.versions = approved_versions }
      } else if .event != "source.status" && selected_source != "application" { abort }
      if exists(parsed.dropped) {
        value = int!(parsed.dropped)
        if .event != "source.status" || value < 0 || value > 1000000 { abort }
        .dropped = value
      }
      if exists(parsed.malformed) {
        value = int!(parsed.malformed)
        if .event != "source.status" || value < 0 || value > 1000000 { abort }
        .malformed = value
      }
      if exists(parsed.requestId) {
        value = string!(parsed.requestId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .requestId = value
      }
      if exists(parsed.operationId) {
        value = string!(parsed.operationId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .operationId = value
      }
      if exists(parsed.runId) {
        value = string!(parsed.runId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .runId = value
      }
      if exists(parsed.writerId) {
        value = string!(parsed.writerId)
        if !match(value, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { abort }
        .writerId = value
      }
      if exists(parsed.errorCode) {
        value = string!(parsed.errorCode)
        if !includes(["UNAUTHENTICATED", "AUTHORITY_UNAVAILABLE", "REALTIME_LIMIT", "INVALID_REQUEST", "INTERNAL_ERROR", "NOT_FOUND", "DEPENDENCY_UNAVAILABLE", "DIAGNOSTICS_UNAVAILABLE", "INVALID_REALTIME_TICKET", "NOTE_NOT_FOUND", "PAYLOAD_TOO_LARGE", "REQUEST_ABORTED", "STARTUP_FAILED", "SHUTDOWN_FAILED", "INVALID_CONFIG", "DATABASE_UNAVAILABLE", "DATABASE_URL_REQUIRED", "ENV_FILE_UNAVAILABLE", "UNSAFE_ENV_FILE", "INVALID_CREDENTIALS", "RATE_LIMITED", "SESSION_REVOKED", "SESSION_NOT_FOUND", "RECENT_AUTH_REQUIRED", "EMAIL_VERIFICATION_REQUIRED", "RECORD_NOT_FOUND", "MEDIA_NOT_FOUND", "MEDIA_CONFLICT", "STORAGE_UNAVAILABLE", "FIREBASE_UNAVAILABLE", "FIREBASE_USER_DISABLED", "FIREBASE_TOKEN_REVOKED"], value) { abort }
        .errorCode = value
      }
      if exists(parsed.route) {
        value = string!(parsed.route)
        if !includes(["/", "/reference", "/reference/config", "/notes", "/notes/:id", "/health/live", "/health/ready", "/accounts/me", "/sessions", "/sessions/revoke", "/identity/firebase/bootstrap", "/identity/local/register", "/identity/local/login", "/identity/local/refresh", "/identity/local/password/change", "/identity/local/verification/request", "/identity/local/verification/confirm", "/identity/local/reset/request", "/identity/local/reset/confirm", "/media", "/media/uploads", "/media/uploads/:id/content", "/media/uploads/:id/finalize", "/media/:id/content", "/media/:id", "/media/cleanup", "/push/destinations", "/push/destinations/:id", "/push/self", "/realtime/profile", "/realtime/tickets", "/realtime/centrifugo-grants", "/realtime/centrifugo/connect", "/realtime/centrifugo/refresh"], value) { abort }
        .route = value
      }
      if exists(parsed.method) {
        value = string!(parsed.method)
        if !includes(["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "CONNECT", "TRACE"], value) { abort }
        .method = value
      }
      if exists(parsed.count) {
        value = int!(parsed.count)
        if value < 0 || value > 1000000 { abort }
        .count = value
      }
      if exists(parsed.statusCode) {
        value = int!(parsed.statusCode)
        if value < 100 || value > 599 { abort }
        .statusCode = value
      }
      if exists(parsed.sequence) {
        value = int!(parsed.sequence)
        if value < 1 || value > 9007199254740991 { abort }
        .sequence = value
      }
      if exists(parsed.durationMs) {
        value = to_float!(parsed.durationMs)
        if !is_integer(parsed.durationMs) && !is_float(parsed.durationMs) { abort }
        if value < 0.0 || value > 86400000.0 { abort }
        .durationMs = value
      }
      # No free text, URL, headers, cookies, payloads or raw environments survive.
sinks:
  live:
    type: socket
    inputs: [sanitize]
    mode: tcp
    # Native private loopback profile. A selected Compose renderer must supply its private service destination.
    address: 127.0.0.1:58233
    encoding: { codec: json }
    framing: { method: newline_delimited }
    buffer: { type: memory, max_events: 128, when_full: drop_newest }
    acknowledgements: { enabled: false }
tests:
  - name: approved facts survive while private sentinel fields are removed
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","requestId":"12345678-1234-4123-8123-123456789abc","operationId":"22345678-1234-4123-8123-123456789abc","runId":"32345678-1234-4123-8123-123456789abc","writerId":"42345678-1234-4123-8123-123456789abc","sequence":17,"count":2,"durationMs":12.5,"method":"POST","statusCode":201,"route":"/notes","headers":{"authorization":"private-sentinel-cookie-token-signed-url"},"message":"private-sentinel-cookie-token-signed-url","error":{"stack":"private-sentinel-cookie-token-signed-url"},"url":"https://private.invalid/?sig=private-sentinel-cookie-token-signed-url"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.route, "/notes")
              assert_eq!(.method, "POST")
              assert_eq!(.statusCode, 201)
              assert_eq!(.durationMs, 12.5)
              assert_eq!(.count, 2)
              assert_eq!(.sequence, 17)
              assert_eq!(.writerId, "42345678-1234-4123-8123-123456789abc")
              assert_eq!(.requestId, "12345678-1234-4123-8123-123456789abc")
              assert_eq!(.operationId, "22345678-1234-4123-8123-123456789abc")
              assert_eq!(.runId, "32345678-1234-4123-8123-123456789abc")
              assert!(!exists(.message) && !exists(.headers) && !exists(.error) && !exists(.url))
              assert!(!contains(encode_json(.), "private-sentinel"))
  - name: malformed JSON is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{malformed'
  - name: unknown events are dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"private.arbitrary-event"}'
  - name: foreign project is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"other-project","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: foreign service is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"other-service","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: unsupported schema version is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":2,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: raw route URLs are dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","route":"/notes/secret-id?token=private-sentinel-cookie-token-signed-url"}'
  - name: out of bounds status is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","statusCode":999}'
  - name: out of bounds duration is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","durationMs":86400001}'
  - name: non-numeric duration is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.completed","durationMs":"12.5"}'
  - name: invalid calendar timestamp is dropped
    no_outputs_from: [sanitize]
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-99-99T12:00:00Z","environment":"test","severity":"info","event":"http.completed"}'
  - name: application.start-failed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"application.start-failed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "application.start-failed")'
  - name: application.stopped is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"application.stopped"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "application.stopped")'
  - name: framework.log is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"debug","event":"framework.log"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "framework.log")'
  - name: http.failed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"http.failed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "http.failed")'
  - name: operation.completed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"operation.completed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "operation.completed")'
  - name: operation.failed is accepted
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-16T12:00:00.000Z","environment":"test","severity":"info","event":"operation.failed"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: 'assert_eq!(.event, "operation.failed")'

  - name: worker source is revalidated
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-17T00:00:00.000Z","environment":"test","severity":"info","runId":"12345678-1234-4123-8123-123456789abc","operationId":"22345678-1234-4123-8123-123456789abc","message":"PRIVATE_SENTINEL","parameters":["PRIVATE_SENTINEL"],"providerMessage":"PRIVATE_SENTINEL","event":"job.completed","source":"workers","job":"mail-dispatch"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.job, "mail-dispatch")
              assert!(!contains(encode_json(.), "PRIVATE_SENTINEL"))
              assert_eq!(.source, "workers")
              assert_eq!(.parse_status, "normalized")

  - name: native database safe facts exclude raw SQL
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-17T00:00:00.000Z","environment":"test","severity":"info","runId":"12345678-1234-4123-8123-123456789abc","operationId":"22345678-1234-4123-8123-123456789abc","message":"PRIVATE_SENTINEL","parameters":["PRIVATE_SENTINEL"],"providerMessage":"PRIVATE_SENTINEL","event":"database.completed","source":"database","database":"postgres","databaseOperation":"transaction","sql":"PRIVATE_SENTINEL"}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.databaseOperation, "transaction")
              assert!(!contains(encode_json(.), "PRIVATE_SENTINEL"))
              assert_eq!(.source, "database")
              assert_eq!(.parse_status, "normalized")

  - name: process infrastructure only
    inputs:
      - insert_at: sanitize
        type: log
        log_fields:
          message: '{"version":1,"project":"generated-api","service":"generated-api","timestamp":"2026-11-17T00:00:00.000Z","environment":"test","severity":"info","runId":"12345678-1234-4123-8123-123456789abc","operationId":"22345678-1234-4123-8123-123456789abc","message":"PRIVATE_SENTINEL","parameters":["PRIVATE_SENTINEL"],"providerMessage":"PRIVATE_SENTINEL","event":"infrastructure.sampled","source":"infrastructure","infrastructure":{"component":"node-process","rssBytes":1000,"heapUsedBytes":500,"uptimeSeconds":3,"environment":"PRIVATE_SENTINEL"}}'
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.infrastructure.component, "node-process")
              assert!(!contains(encode_json(.), "PRIVATE_SENTINEL"))
              assert_eq!(.source, "infrastructure")
              assert_eq!(.parse_status, "normalized")

  - name: retained assertions and artifact metadata are sanitized
    inputs:
      - insert_at: sanitize
