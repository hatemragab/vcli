services:
  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    command: [centrifugo, -c, /etc/centrifugo/config.json]
    extra_hosts: [host.docker.internal:host-gateway]
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?Set the private API key}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3100}
      CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS: ${CENTRIFUGO_CALLBACK_HEADERS:?Set the private proxy header JSON}
      CENTRIFUGO_CLIENT_PROXY_REFRESH_HTTP_STATIC_HEADERS: ${CENTRIFUGO_CALLBACK_HEADERS:?Set the private proxy header JSON}
    ports: [127.0.0.1:8000:8000, 127.0.0.1:9000:9000]
    volumes: [./config.json:/etc/centrifugo/config.json:ro]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
