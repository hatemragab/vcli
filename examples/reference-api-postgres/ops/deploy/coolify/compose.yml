services:
  api:
    image: ${REFERENCE_IMAGE:?Set the reviewed registry image digest}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3101'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set exact allowed HTTPS origins}
      DATABASE_URL: ${DATABASE_URL:?Set private database connection}
      AUTH_DRIVER: ${AUTH_DRIVER:-local}
      JWT_SECRET: ${JWT_SECRET:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      MAIL_DRIVER: smtp
      MAIL_FROM: ${MAIL_FROM:?Set verified sender}
      SMTP_HOST: ${SMTP_HOST:?Set private SMTP endpoint}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REALTIME_DRIVER: socketio
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /app/var/storage
      EVIDENCE_DIRECTORY: /app/var/evidence
    expose: ['3101']
    volumes: [uploads:/app/var/storage, evidence:/app/var/evidence]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: local
      options: { max-size: 5m, max-file: '2' }
volumes:
  uploads: { external: true, name: reference-api-postgres-uploads }
  evidence: { external: true, name: reference-api-postgres-evidence }
